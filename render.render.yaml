# Render Blueprint — deploy 1 nút, free tier (không cần thẻ)
# Render đọc file này khi bấm "New > Blueprint" hoặc nút Deploy trong README.
services:
  - type: web
    name: vietlott-analytics
    runtime: python
    plan: free
    autoDeploy: true
    healthCheckPath: /api/stats
    buildCommand: python scripts/fetch_data.py && python scripts/build_db.py
    startCommand: python app/server.py
