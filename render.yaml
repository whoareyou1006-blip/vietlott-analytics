# Render.com Blueprint — free web service, no DB card.
# Deploy: https://render.com/deploy?repo=https://github.com/whoareyou1006-blip/vietlott-analytics
# Or: render.com -> New -> Blueprint -> chọn repo -> Apply.
services:
  - type: web
    name: vietlott-analytics
    runtime: python
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /api/stats
    buildCommand: python scripts/fetch_data.py && python scripts/build_db.py
    startCommand: python app/server.py
    envVars:
      - key: PORT
        sync: false
